name: Guarded FFN Gate Up Fusion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ffn-gate-up-fusion.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fused FFN gate-up prefill path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          h=Path('include/memvanta/gguf_kernels.hpp')
          s=h.read_text()
          needle='void tensor_matmul_batch_v06(const GgufFile&,const GgufTensor&,const float* x,float* y,std::size_t batch,unsigned threads=1,WorkerPool* pool=nullptr);\n'
          add=needle+'// Fused prefill path for SwiGLU gate/up projections. Writes SiLU(gate)*up directly.\nvoid tensor_ffn_gate_up_batch_v06(const GgufFile&,const GgufTensor& gate,const GgufTensor& up,const float* x,float* ff,std::size_t batch,unsigned threads=1,WorkerPool* pool=nullptr);\n'
          if s.count(needle)!=1: raise SystemExit('header declaration anchor mismatch')
          h.write_text(s.replace(needle,add,1))

          p=Path('src/gguf_kernels.cpp')
          s=p.read_text()
          anchor='\n} // namespace memvanta\n'
          if s.count(anchor)!=1: raise SystemExit('kernel namespace anchor mismatch')
          fn=dedent(r'''

          void tensor_ffn_gate_up_batch_v06(const GgufFile&file,const GgufTensor&gate,const GgufTensor&up,const float*x,float*ff,std::size_t batch,unsigned threads,WorkerPool*pool){
              const auto t0=Clock::now();
              if(gate.dims.size()<2||up.dims.size()<2||gate.ne(0)!=up.ne(0)||gate.ne(1)!=up.ne(1))throw std::runtime_error("fused FFN gate/up shape mismatch");
              const std::size_t cols=gate.ne(0),rows=gate.ne(1);
              const bool packed=(gate.type==GgmlType::Q4_0||gate.type==GgmlType::Q8_0)&&up.type==gate.type&&cols%32==0&&batch>=2;
              if(!packed){
                  std::vector<float> g(batch*rows),u(batch*rows);
                  tensor_matmul_batch_v06(file,gate,x,g.data(),batch,threads,pool);
                  tensor_matmul_batch_v06(file,up,x,u.data(),batch,threads,pool);
                  parallel_rows(batch*rows,threads,pool,[&](std::size_t a,std::size_t z){for(std::size_t i=a;i<z;++i){const float v=g[i];ff[i]=(v/(1.0f+std::exp(-v)))*u[i];}});
                  return;
              }
              const std::byte*pg=file.tensor_data(gate),*pu=file.tensor_data(up);const std::size_t nb=cols/32;
              parallel_rows(rows,threads,pool,[&](std::size_t r0,std::size_t r1){
                  for(std::size_t r=r0;r<r1;++r){
                      std::size_t b=0;
                      for(;b+8<=batch;b+=8){
                          float g[8],u[8];
                          if(gate.type==GgmlType::Q4_0){
                              q4_row_batch8_fp32(reinterpret_cast<const GgufBlockQ4_0*>(pg)+r*nb,x+b*cols,cols,nb,g);
                              q4_row_batch8_fp32(reinterpret_cast<const GgufBlockQ4_0*>(pu)+r*nb,x+b*cols,cols,nb,u);
                          }else{
                              q8_row_batch8_fp32(reinterpret_cast<const GgufBlockQ8_0*>(pg)+r*nb,x+b*cols,cols,nb,g);
                              q8_row_batch8_fp32(reinterpret_cast<const GgufBlockQ8_0*>(pu)+r*nb,x+b*cols,cols,nb,u);
                          }
                          for(int j=0;j<8;++j){const float v=g[j];ff[(b+j)*rows+r]=(v/(1.0f+std::exp(-v)))*u[j];}
                      }
                      for(;b<batch;++b){
                          float g,u;
                          if(gate.type==GgmlType::Q4_0){
                              g=dot_q4_0_fp32(reinterpret_cast<const GgufBlockQ4_0*>(pg)+r*nb,x+b*cols,cols);
                              u=dot_q4_0_fp32(reinterpret_cast<const GgufBlockQ4_0*>(pu)+r*nb,x+b*cols,cols);
                          }else{
                              g=dot_q8_0_fp32(reinterpret_cast<const GgufBlockQ8_0*>(pg)+r*nb,x+b*cols,cols);
                              u=dot_q8_0_fp32(reinterpret_cast<const GgufBlockQ8_0*>(pu)+r*nb,x+b*cols,cols);
                          }
                          ff[b*rows+r]=(g/(1.0f+std::exp(-g)))*u;
                      }
                  }
              });
              profile_add(gate,batch,std::chrono::duration<double,std::milli>(Clock::now()-t0).count());
          }
          ''')
          p.write_text(s.replace(anchor,fn+anchor,1))

          m=Path('src/llama_model.cpp')
          s=m.read_text()
          old_alloc='PROJ(B*D),G(B*F),U(B*F),FF(B*F),OUT(B*D)'
          new_alloc='PROJ(B*D),FF(B*F),OUT(B*D)'
          if s.count(old_alloc)!=1: raise SystemExit(f'allocation anchor mismatch: {s.count(old_alloc)}')
          s=s.replace(old_alloc,new_alloc,1)
          old='tensor_matmul_batch_v06(file_,*L.gate,N.data(),G.data(),B,threads_,&pool_);tensor_matmul_batch_v06(file_,*L.up,N.data(),U.data(),B,threads_,&pool_);pool_.parallel_for(B*F,[&](std::size_t a,std::size_t z){for(std::size_t i=a;i<z;++i){float x=G[i];FF[i]=(x/(1.0f+std::exp(-x)))*U[i];}});tensor_matmul_batch_v06(file_,*L.down,FF.data(),OUT.data(),B,threads_,&pool_);'
          new='tensor_ffn_gate_up_batch_v06(file_,*L.gate,*L.up,N.data(),FF.data(),B,threads_,&pool_);tensor_matmul_batch_v06(file_,*L.down,FF.data(),OUT.data(),B,threads_,&pool_);'
          if s.count(old)!=1: raise SystemExit(f'FFN call anchor mismatch: {s.count(old)}')
          m.write_text(s.replace(old,new,1))
          PY
          git diff -- include/memvanta/gguf_kernels.hpp src/gguf_kernels.cpp src/llama_model.cpp

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target memvanta_profile memvanta_tests memvanta_tokenizer_tests -j "$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Commit tested candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/memvanta/gguf_kernels.hpp src/gguf_kernels.cpp src/llama_model.cpp
          git commit -m "Fuse FFN gate and up prefill path"
          git pull --rebase origin main
          git push origin HEAD:main
