name: Q4 2D Scheduler Screen v2

# Retrigger marker: 2026-08-22
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q4-2d-scheduler-screen-v2.yml'

permissions:
  contents: write

env:
  MODEL: stories15M-q4_0.gguf
  MODEL_URL: https://huggingface.co/ggml-org/models-moved/resolve/main/tinyllamas/stories15M-q4_0.gguf?download=true
  MODEL_SHA256: 66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
  REPS: 3

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl time
      - name: Download model
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$MODEL_URL" -o "$MODEL"
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -
      - name: Build baseline and scheduler candidate
        run: |
          set -euo pipefail
          cp src/gguf_kernels.cpp /tmp/gguf_kernels.baseline.cpp
          cmake -S . -B build-baseline -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-baseline --target memvanta_profile memvanta_tests memvanta_tokenizer_tests -j "$(nproc)"
          ctest --test-dir build-baseline --output-on-failure
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gguf_kernels.cpp')
          s=p.read_text()
          needle='''        const bool ffn=is_ffn_tensor(t.name);parallel_rows(rows,threads,pool,[&](std::size_t r0,std::size_t r1){for(std::size_t r=r0;r<r1;++r){std::size_t b=0;if(ffn){for(;b+8<=batch;b+=8){float o[8];if(t.type==GgmlType::Q4_0)q4_row_batch8_fp32(reinterpret_cast<const GgufBlockQ4_0*>(p)+r*nb,x+b*cols,cols,nb,o);else q8_row_batch8_fp32(reinterpret_cast<const GgufBlockQ8_0*>(p)+r*nb,x+b*cols,cols,nb,o);for(int j=0;j<8;++j)y[(b+j)*rows+r]=o[j];}}else{for(;b+4<=batch;b+=4){float o[4];if(t.type==GgmlType::Q4_0)q4_row_batch4_fp32(reinterpret_cast<const GgufBlockQ4_0*>(p)+r*nb,x+b*cols,cols,nb,o);else q8_row_batch4_fp32(reinterpret_cast<const GgufBlockQ8_0*>(p)+r*nb,x+b*cols,cols,nb,o);for(int j=0;j<4;++j)y[(b+j)*rows+r]=o[j];}}for(;b<batch;++b){if(t.type==GgmlType::Q4_0)y[b*rows+r]=dot_q4_0_fp32(reinterpret_cast<const GgufBlockQ4_0*>(p)+r*nb,x+b*cols,cols);else y[b*rows+r]=dot_q8_0_fp32(reinterpret_cast<const GgufBlockQ8_0*>(p)+r*nb,x+b*cols,cols);}}});'''
          repl='''        const char* ge=std::getenv("MEMVANTA_SCHED_GROUP");
        if(ge&&*ge){
            const std::size_t group=std::strtoul(ge,nullptr,10);
            const char* te=std::getenv("MEMVANTA_SCHED_ROW_TILE");
            const std::size_t tile=std::max<std::size_t>(1,te?std::strtoul(te,nullptr,10):1);
            const char* oe=std::getenv("MEMVANTA_SCHED_ORDER");
            const bool bm=oe&&std::strcmp(oe,"batch")==0;
            const std::size_t rt=(rows+tile-1)/tile,bg=batch/group,jobs=rt*bg;
            parallel_rows(jobs,threads,pool,[&](std::size_t a,std::size_t z){for(std::size_t job=a;job<z;++job){const std::size_t ri=bm?job%rt:job/bg,bi=bm?job/rt:job%bg;const std::size_t r0=ri*tile,r1=std::min(rows,r0+tile),b0=bi*group;for(std::size_t r=r0;r<r1;++r){if(group==8){float o[8];if(t.type==GgmlType::Q4_0)q4_row_batch8_fp32(reinterpret_cast<const GgufBlockQ4_0*>(p)+r*nb,x+b0*cols,cols,nb,o);else q8_row_batch8_fp32(reinterpret_cast<const GgufBlockQ8_0*>(p)+r*nb,x+b0*cols,cols,nb,o);for(int k=0;k<8;++k)y[(b0+k)*rows+r]=o[k];}else{float o[4];if(t.type==GgmlType::Q4_0)q4_row_batch4_fp32(reinterpret_cast<const GgufBlockQ4_0*>(p)+r*nb,x+b0*cols,cols,nb,o);else q8_row_batch4_fp32(reinterpret_cast<const GgufBlockQ8_0*>(p)+r*nb,x+b0*cols,cols,nb,o);for(int k=0;k<4;++k)y[(b0+k)*rows+r]=o[k];}}}});
        }else{
''' + needle + '''
        }'''
          if needle not in s:
              raise SystemExit('scheduler replacement target not found')
          p.write_text(s.replace(needle,repl,1))
          PY
          cmake -S . -B build-sched -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sched --target memvanta_profile memvanta_tests memvanta_tokenizer_tests -j "$(nproc)"
          ctest --test-dir build-sched --output-on-failure
          cp /tmp/gguf_kernels.baseline.cpp src/gguf_kernels.cpp
          git diff --exit-code -- src/gguf_kernels.cpp
      - name: Benchmark schedules
        run: |
          set -euo pipefail
          mkdir -p results/q4-2d-scheduler-screen-v2
          python3 - <<'PY'
          import json, os, random, re, statistics, subprocess
          from pathlib import Path
          variants=['baseline']+[f'g{g}_r{r}_{o}' for g in (4,8) for r in (1,2,4,8,16) for o in ('row','batch')]
          reps=int(os.environ['REPS']); rng=random.Random(20260822); order=[]; data={v:[] for v in variants}
          for _ in range(reps):
              b=variants[:]; rng.shuffle(b); order+=b
          mr=re.compile(r'\b(prefill_ms|decode_total_ms)=([0-9.]+)'); rr=re.compile(r'Maximum resident set size \(kbytes\):\s*(\d+)')
          for v in order:
              e=os.environ.copy(); e.update({'OMP_NUM_THREADS':'4','OMP_DYNAMIC':'FALSE','OMP_PROC_BIND':'close','OMP_PLACES':'cores','MALLOC_ARENA_MAX':'2'})
              build='build-baseline'
              if v!='baseline':
                  build='build-sched'; a=v.split('_'); e['MEMVANTA_SCHED_GROUP']=a[0][1:]; e['MEMVANTA_SCHED_ROW_TILE']=a[1][1:]; e['MEMVANTA_SCHED_ORDER']=a[2]
              p=subprocess.run(['/usr/bin/time','-v',f'./{build}/memvanta_profile','--model',os.environ['MODEL'],'--threads','4','--ctx','128','--prompt','64','--gen','16','--batch','32'],env=e,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=180)
              if p.returncode: raise SystemExit(f'{v} rc={p.returncode}\n{p.stderr}')
              m=dict((k,float(x)) for k,x in mr.findall(p.stdout)); q=rr.search(p.stderr)
              data[v].append((m['prefill_ms'],m['decode_total_ms'],float(q.group(1))))
          def agg(v):
              x=data[v]; pm=[a[0] for a in x]; dm=[a[1] for a in x]; rm=[a[2] for a in x]
              return {'prefill_ms':statistics.mean(pm),'decode_ms':statistics.mean(dm),'rss_kib':statistics.mean(rm),'prefill_cv':100*statistics.stdev(pm)/statistics.mean(pm),'decode_cv':100*statistics.stdev(dm)/statistics.mean(dm)}
          rows={v:agg(v) for v in variants}; base=rows['baseline']
          def score(r):
              return 2/(1/(64000/r['prefill_ms'])+1/(16000/r['decode_ms']))
          bs=score(base); bdec=16000/base['decode_ms']; passed=[]
          for v,r in rows.items():
              r['prefill_tps']=64000/r['prefill_ms']; r['decode_tps']=16000/r['decode_ms']; r['gain']=(score(r)/bs-1)*100; r['rss_delta']=(r['rss_kib']/base['rss_kib']-1)*100; r['decode_delta']=(r['decode_tps']/bdec-1)*100
              r['pass']=v!='baseline' and r['gain']>=8 and r['rss_delta']<=2 and r['prefill_cv']<=5 and r['decode_cv']<=5 and r['decode_delta']>=-2
              if r['pass']: passed.append((score(r),v))
          winner=max(passed)[1] if passed else None; ranked=sorted(variants,key=lambda v:score(rows[v]),reverse=True)
          Path('results/q4-2d-scheduler-screen-v2/summary.json').write_text(json.dumps({'winner':winner,'rows':rows},indent=2)+'\n')
          lines=['# Q4 2D scheduler screen v2','', '| Rank | Variant | Prefill tok/s | Decode tok/s | Gain | RSS delta | Prefill CV | Decode CV | Pass |','|---:|---|---:|---:|---:|---:|---:|---:|:---:|']
          for i,v in enumerate(ranked,1):
              r=rows[v]; lines.append(f"| {i} | {v} | {r['prefill_tps']:.2f} | {r['decode_tps']:.2f} | {r['gain']:.2f}% | {r['rss_delta']:.2f}% | {r['prefill_cv']:.2f}% | {r['decode_cv']:.2f}% | {'YES' if r['pass'] else 'no'} |")
          lines+=['',f'Winner: **{winner or "none"}**.']
          Path('results/q4-2d-scheduler-screen-v2/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Verify source unchanged
        run: git diff --exit-code -- src include benchmarks tests CMakeLists.txt
      - name: Publish evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/q4-2d-scheduler-screen-v2/SUMMARY.md results/q4-2d-scheduler-screen-v2/summary.json
          git commit -m 'Publish Q4 2D scheduler screen v2 evidence'
          git pull --rebase origin main
          git push
