name: Guarded Revert FFN Gate Up Fusion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revert-ffn-gate-up.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source revert without committing
        run: |
          set -euo pipefail
          git revert --no-commit 97766d7a346cce372e199ba666ec1e17ed1efa96
          git diff -- include/memvanta/gguf_kernels.hpp src/gguf_kernels.cpp src/llama_model.cpp

      - name: Build and test reverted source
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target memvanta_profile memvanta_tests memvanta_tokenizer_tests -j "$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Commit tested revert
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/memvanta/gguf_kernels.hpp src/gguf_kernels.cpp src/llama_model.cpp
          git commit -m "Revert unproven FFN gate-up fusion"
          git pull --rebase origin main
          git push origin HEAD:main
