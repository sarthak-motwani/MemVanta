name: Guarded Revert Q4 Scale Hoist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revert-q4-scale-hoist.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert narrow Q4 batch4 scale-hoist patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gguf_kernels.cpp')
          s=p.read_text()
          old='''for(std::size_t bi=0;bi<nb;++bi){const __m256 ds=_mm256_set1_ps(fp16_to_fp32(w[bi].d));const __m128i packed=_mm_loadu_si128(reinterpret_cast<const __m128i*>(w[bi].qs));const __m128i lo=_mm_sub_epi8(_mm_and_si128(packed,mask),bias),hi=_mm_sub_epi8(_mm_and_si128(_mm_srli_epi16(packed,4),mask),bias);for(int h=0;h<2;++h){const __m128i src=h?hi:lo;for(int k=0;k<16;k+=8){__m256 q=_mm256_mul_ps(_mm256_cvtepi32_ps(_mm256_cvtepi8_epi32(_mm_srli_si128(src,k))),ds);std::size_t off=bi*32+h*16+k;'''
          new='''for(std::size_t bi=0;bi<nb;++bi){const float d=fp16_to_fp32(w[bi].d);const __m128i packed=_mm_loadu_si128(reinterpret_cast<const __m128i*>(w[bi].qs));const __m128i lo=_mm_sub_epi8(_mm_and_si128(packed,mask),bias),hi=_mm_sub_epi8(_mm_and_si128(_mm_srli_epi16(packed,4),mask),bias);for(int h=0;h<2;++h){const __m128i src=h?hi:lo;for(int k=0;k<16;k+=8){__m256 q=_mm256_mul_ps(_mm256_cvtepi32_ps(_mm256_cvtepi8_epi32(_mm_srli_si128(src,k))),_mm256_set1_ps(d));std::size_t off=bi*32+h*16+k;'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one scale-hoist pattern, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff -- src/gguf_kernels.cpp

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target memvanta_profile memvanta_tests memvanta_tokenizer_tests -j "$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Commit tested revert
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gguf_kernels.cpp
          git commit -m "Revert noisy Q4 batch4 scale hoist"
          git pull --rebase origin main
          git push origin HEAD:main
