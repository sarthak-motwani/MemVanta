name: One Billion Model A/B

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneb-model-ab.yml'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

env:
  MODEL: TinyLlama-1.1B-Chat-v1.0.Q4_0.gguf
  MODEL_URL: https://huggingface.co/QuantFactory/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/TinyLlama-1.1B-Chat-v1.0.Q4_0.gguf?download=true
  MODEL_SHA256: 58d7f78ad80e6745d2148dc7391740c2de761da5791c853dec9a09b1f43a1ea9
  THREADS: 4
  CTX: 768
  PROMPT: 512
  GEN: 128
  BATCH: 32
  KV: f16
  REPS: 5
  WARMUP: 1
  LLAMA_CPP_REF: 6503355df0eb4f65875012523263c302fe0088c1
  OMP_NUM_THREADS: 4
  OMP_DYNAMIC: 'FALSE'
  OMP_PROC_BIND: close
  OMP_PLACES: cores
  MALLOC_ARENA_MAX: 2

jobs:
  tinyllama-11b-ab:
    name: TinyLlama 1.1B Q4_0 repeated A/B
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout MemVanta
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl git time ccache python3

      - name: Build MemVanta
        run: |
          cmake -S . -B build-oneb -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-oneb -j "$(nproc)"
          ctest --test-dir build-oneb --output-on-failure

      - name: Prepare evidence directory
        run: mkdir -p oneb-model-ab

      - name: Download and verify TinyLlama 1.1B Q4_0
        run: |
          curl -L --fail --retry 3 --retry-delay 3 "$MODEL_URL" -o "$MODEL"
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c - | tee oneb-model-ab/model-sha-check.txt
          sha256sum "$MODEL" | tee oneb-model-ab/model.sha256
          stat -c 'model_bytes=%s' "$MODEL" | tee oneb-model-ab/model-size.txt

      - name: Native compatibility diagnostics
        id: native_smoke
        continue-on-error: true
        run: |
          set +e
          ./build-oneb/memvanta_tokenize "$MODEL" 'The capital of France is' --bos \
            > oneb-model-ab/tokenizer-smoke.txt \
            2> oneb-model-ab/tokenizer-smoke.stderr.txt
          tok_rc=$?
          echo "$tok_rc" > oneb-model-ab/tokenizer-smoke.exitcode.txt

          timeout --signal=TERM --kill-after=20s 900 \
            ./build-oneb/memvanta_real --model "$MODEL" --threads "$THREADS" --ctx "$CTX" \
            --temperature 0 --n 8 --prompt 'The capital of France is' \
            > oneb-model-ab/generation-smoke.txt \
            2> oneb-model-ab/generation-smoke.stderr.txt
          gen_rc=$?
          echo "$gen_rc" > oneb-model-ab/generation-smoke.exitcode.txt

          echo "tokenizer_rc=$tok_rc" | tee oneb-model-ab/native-smoke-status.txt
          echo "generation_rc=$gen_rc" | tee -a oneb-model-ab/native-smoke-status.txt
          exit 0

      - name: Build pinned llama.cpp CPU tools
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REF"
          git -C llama.cpp checkout --detach FETCH_HEAD
          cmake -S llama.cpp -B llama.cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF -DGGML_METAL=OFF -DLLAMA_CURL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build llama.cpp/build --target llama-bench -j "$(nproc)"

      - name: Record provenance
        run: |
          {
            echo "model=$MODEL"
            echo "model_sha256=$MODEL_SHA256"
            echo "memvanta_commit=$GITHUB_SHA"
            echo "llama_cpp_ref=$LLAMA_CPP_REF"
            echo "threads=$THREADS prompt=$PROMPT gen=$GEN ctx=$CTX batch=$BATCH kv=$KV reps=$REPS warmup=$WARMUP"
            uname -a
            lscpu
            free -h
          } > oneb-model-ab/environment.txt

      - name: Run MemVanta repeated benchmark
        id: mem_bench
        continue-on-error: true
        run: |
          set +e
          /usr/bin/time -v ./build-oneb/memvanta_real_bench \
            --model "$MODEL" --threads "$THREADS" --ctx "$CTX" \
            --prompt "$PROMPT" --gen "$GEN" --batch "$BATCH" --kv "$KV" \
            --warmup "$WARMUP" --reps "$REPS" --no-client \
            --csv oneb-model-ab/memvanta.csv \
            > oneb-model-ab/memvanta.stdout.txt 2> oneb-model-ab/memvanta.time.txt
          rc=$?
          echo "$rc" > oneb-model-ab/memvanta.exitcode.txt
          exit 0

      - name: Run llama.cpp repeated benchmark
        id: llama_bench
        continue-on-error: true
        run: |
          set +e
          /usr/bin/time -v ./llama.cpp/build/bin/llama-bench \
            -m "$MODEL" -p "$PROMPT" -n "$GEN" -t "$THREADS" -r "$REPS" \
            -b "$BATCH" -ub "$BATCH" -ctk "$KV" -ctv "$KV" -ngl 0 -o json \
            > oneb-model-ab/llama-bench.json 2> oneb-model-ab/llama-bench.time.txt
          rc=$?
          echo "$rc" > oneb-model-ab/llama-bench.exitcode.txt
          exit 0

      - name: Summarize A/B when both benchmarks succeeded
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import csv,json,pathlib,re,statistics
          o=pathlib.Path('oneb-model-ab')
          mrc=int((o/'memvanta.exitcode.txt').read_text().strip())
          lrc=int((o/'llama-bench.exitcode.txt').read_text().strip())
          status={'memvanta_exit':mrc,'llama_exit':lrc}
          if mrc or lrc or not (o/'memvanta.csv').exists() or not (o/'llama-bench.json').exists():
              (o/'diagnostic-summary.json').write_text(json.dumps(status,indent=2)+'\n')
              raise SystemExit(0)
          rows=list(csv.DictReader((o/'memvanta.csv').open()))
          mpp=[float(r['pp_tps']) for r in rows]; mtg=[float(r['tg_tps']) for r in rows]
          lj=json.loads((o/'llama-bench.json').read_text()); lj=[lj] if isinstance(lj,dict) else lj
          lpp=[];ltg=[]
          for r in lj:
              vals=[float(x) for x in (r.get('samples_ts') or [r.get('avg_ts')]) if x is not None]
              if int(r.get('n_prompt',0) or 0) and not int(r.get('n_gen',0) or 0): lpp+=vals
              if int(r.get('n_gen',0) or 0) and not int(r.get('n_prompt',0) or 0): ltg+=vals
          def rss(p):
              m=re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)',p.read_text(errors='replace')); return int(m.group(1)) if m else None
          def d(x): return {'mean':statistics.mean(x),'sd':statistics.stdev(x),'min':min(x),'max':max(x),'cv_pct':statistics.stdev(x)/statistics.mean(x)*100}
          s={'benchmark':'TinyLlama 1.1B Q4_0 same-model CPU A/B','memvanta_pp':d(mpp),'memvanta_tg':d(mtg),'llama_pp':d(lpp),'llama_tg':d(ltg),'memvanta_peak_rss_kib':rss(o/'memvanta.time.txt'),'llama_peak_rss_kib':rss(o/'llama-bench.time.txt')}
          s['llama_vs_memvanta_pp_speedup']=s['llama_pp']['mean']/s['memvanta_pp']['mean']
          s['llama_vs_memvanta_tg_speedup']=s['llama_tg']['mean']/s['memvanta_tg']['mean']
          s['memvanta_rss_reduction_pct']=(1-s['memvanta_peak_rss_kib']/s['llama_peak_rss_kib'])*100
          (o/'summary.json').write_text(json.dumps(s,indent=2)+'\n')
          (o/'SUMMARY.md').write_text(f"# TinyLlama 1.1B Q4_0 — MemVanta vs llama.cpp\n\nSame GGUF, CPU-only, 4 threads, pp512/tg128, context 768, batch 32, F16 KV, 5 repetitions.\n\n- MemVanta pp: {s['memvanta_pp']['mean']:.2f} ± {s['memvanta_pp']['sd']:.2f} tok/s\n- llama.cpp pp: {s['llama_pp']['mean']:.2f} ± {s['llama_pp']['sd']:.2f} tok/s\n- MemVanta tg: {s['memvanta_tg']['mean']:.2f} ± {s['memvanta_tg']['sd']:.2f} tok/s\n- llama.cpp tg: {s['llama_tg']['mean']:.2f} ± {s['llama_tg']['sd']:.2f} tok/s\n- MemVanta peak RSS: {s['memvanta_peak_rss_kib']} KiB\n- llama.cpp peak RSS: {s['llama_peak_rss_kib']} KiB\n- MemVanta RSS reduction: {s['memvanta_rss_reduction_pct']:.2f}%\n")
          print((o/'SUMMARY.md').read_text())
          PY

      - name: Upload benchmark and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memvanta-oneb-model-ab
          path: oneb-model-ab/**
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce benchmark success after evidence upload
        if: always()
        run: |
          tok_rc="$(cat oneb-model-ab/tokenizer-smoke.exitcode.txt 2>/dev/null || echo 127)"
          gen_rc="$(cat oneb-model-ab/generation-smoke.exitcode.txt 2>/dev/null || echo 127)"
          mem_rc="$(cat oneb-model-ab/memvanta.exitcode.txt 2>/dev/null || echo 127)"
          llama_rc="$(cat oneb-model-ab/llama-bench.exitcode.txt 2>/dev/null || echo 127)"
          echo "tokenizer=$tok_rc generation=$gen_rc memvanta_bench=$mem_rc llama_bench=$llama_rc"
          test "$mem_rc" -eq 0
          test "$llama_rc" -eq 0
