name: Q4 2D Scheduler Screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q4-2d-scheduler-screen.yml'

permissions:
  contents: write

env:
  MODEL: stories15M-q4_0.gguf
  MODEL_URL: https://huggingface.co/ggml-org/models-moved/resolve/main/tinyllamas/stories15M-q4_0.gguf?download=true
  MODEL_SHA256: 66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
  REPS: 3
  MIN_SPEED_GAIN_PCT: 8
  MAX_RSS_INCREASE_PCT: 2
  MAX_CV_PCT: 5
  MAX_DECODE_REGRESSION_PCT: 2

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl time

      - name: Download exact trained model
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$MODEL_URL" -o "$MODEL"
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -

      - name: Build baseline and isolated 2D scheduler
        run: |
          set -euo pipefail
          cp src/gguf_kernels.cpp /tmp/gguf_kernels.baseline.cpp
          cmake -S . -B build-baseline -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-baseline --target memvanta_profile memvanta_tests memvanta_tokenizer_tests -j "$(nproc)"
          ctest --test-dir build-baseline --output-on-failure

          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('src/gguf_kernels.cpp')
          s=p.read_text()
          marker='    } else {\n        const bool ffn=is_ffn_tensor(t.name);'
          start=s.find(marker)
          if start < 0: raise SystemExit('hybrid GEMM else block not found')
          tail='\n    }\n    profile_add(t,batch,std::chrono::duration<double,std::milli>(Clock::now()-t0).count());'
          end=s.find(tail,start)
          if end < 0: raise SystemExit('hybrid GEMM block end not found')
          original=s[start+len('    } else {\n'):end]
          alt=r'''    } else {
        const char* sched_group_env=std::getenv("MEMVANTA_SCHED_GROUP");
        if(sched_group_env&&*sched_group_env){
            const std::size_t group=static_cast<std::size_t>(std::strtoul(sched_group_env,nullptr,10));
            const char* tile_env=std::getenv("MEMVANTA_SCHED_ROW_TILE");
            const std::size_t row_tile=std::max<std::size_t>(1,tile_env?static_cast<std::size_t>(std::strtoul(tile_env,nullptr,10)):1);
            const char* order_env=std::getenv("MEMVANTA_SCHED_ORDER");
            const bool batch_major=order_env&&std::strcmp(order_env,"batch")==0;
            if((group!=4&&group!=8)||batch%group)throw std::runtime_error("invalid 2D scheduler group");
            const std::size_t rtiles=(rows+row_tile-1)/row_tile,bgroups=batch/group,jobs=rtiles*bgroups;
            parallel_rows(jobs,threads,pool,[&](std::size_t j0,std::size_t j1){
                for(std::size_t job=j0;job<j1;++job){
                    const std::size_t rt=batch_major?(job%rtiles):(job/bgroups);
                    const std::size_t bg=batch_major?(job/rtiles):(job%bgroups);
                    const std::size_t r0=rt*row_tile,r1=std::min(rows,r0+row_tile),b0=bg*group;
                    for(std::size_t r=r0;r<r1;++r){
                        if(group==8){float o[8];if(t.type==GgmlType::Q4_0)q4_row_batch8_fp32(reinterpret_cast<const GgufBlockQ4_0*>(p)+r*nb,x+b0*cols,cols,nb,o);else q8_row_batch8_fp32(reinterpret_cast<const GgufBlockQ8_0*>(p)+r*nb,x+b0*cols,cols,nb,o);for(int k=0;k<8;++k)y[(b0+k)*rows+r]=o[k];}
                        else{float o[4];if(t.type==GgmlType::Q4_0)q4_row_batch4_fp32(reinterpret_cast<const GgufBlockQ4_0*>(p)+r*nb,x+b0*cols,cols,nb,o);else q8_row_batch4_fp32(reinterpret_cast<const GgufBlockQ8_0*>(p)+r*nb,x+b0*cols,cols,nb,o);for(int k=0;k<4;++k)y[(b0+k)*rows+r]=o[k];}
                    }
                }
            });
        } else {
'''+original+r'''
        }'''
          s=s[:start]+alt+s[end:]
          p.write_text(s)
          PY

          cmake -S . -B build-sched -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sched --target memvanta_profile memvanta_tests memvanta_tokenizer_tests -j "$(nproc)"
          ctest --test-dir build-sched --output-on-failure
          cp /tmp/gguf_kernels.baseline.cpp src/gguf_kernels.cpp
          git diff --exit-code -- src/gguf_kernels.cpp

      - name: Run 20 scheduler variants with RSS gate
        run: |
          set -euo pipefail
          mkdir -p results/q4-2d-scheduler-screen/raw
          python3 - <<'PY'
          import json, os, pathlib, random, re, statistics, subprocess
          root=pathlib.Path('results/q4-2d-scheduler-screen'); raw=root/'raw'
          variants=['baseline']+[f'g{g}_r{r}_{o}' for g in (4,8) for r in (1,2,4,8,16) for o in ('row','batch')]
          reps=int(os.environ['REPS']); rng=random.Random(20260822); order=[]
          for _ in range(reps):
              block=variants.copy(); rng.shuffle(block); order+=block
          data={v:[] for v in variants}
          metric_re=re.compile(r'\b(prefill_ms|decode_total_ms)=([0-9.]+)')
          rss_re=re.compile(r'Maximum resident set size \(kbytes\):\s*(\d+)')
          for i,v in enumerate(order,1):
              env=os.environ.copy(); env.update({'OMP_NUM_THREADS':'4','OMP_DYNAMIC':'FALSE','OMP_PROC_BIND':'close','OMP_PLACES':'cores','MALLOC_ARENA_MAX':'2'})
              build='build-baseline'
              if v!='baseline':
                  build='build-sched'; a=v.split('_'); env['MEMVANTA_SCHED_GROUP']=a[0][1:]; env['MEMVANTA_SCHED_ROW_TILE']=a[1][1:]; env['MEMVANTA_SCHED_ORDER']=a[2]
              cmd=['/usr/bin/time','-v',f'./{build}/memvanta_profile','--model',os.environ['MODEL'],'--threads','4','--ctx','128','--prompt','64','--gen','16','--batch','32','--csv',str(raw/f'{i:03d}-{v}.csv')]
              p=subprocess.run(cmd,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=180)
              (raw/f'{i:03d}-{v}.txt').write_text(p.stdout); (raw/f'{i:03d}-{v}.time.txt').write_text(p.stderr)
              if p.returncode: raise SystemExit(f'{v} failed rc={p.returncode}\n{p.stderr}')
              m=dict((k,float(x)) for k,x in metric_re.findall(p.stdout)); rr=rss_re.search(p.stderr)
              if 'prefill_ms' not in m or 'decode_total_ms' not in m or not rr: raise SystemExit(f'missing metrics for {v}')
              data[v].append((m['prefill_ms'],m['decode_total_ms'],float(rr.group(1))))
          def agg(v):
              xs=data[v]; pm=[x[0] for x in xs]; dm=[x[1] for x in xs]; rm=[x[2] for x in xs]
              return {'prefill_ms':statistics.mean(pm),'decode_ms':statistics.mean(dm),'rss_kib':statistics.mean(rm),'prefill_cv_pct':100*statistics.stdev(pm)/statistics.mean(pm),'decode_cv_pct':100*statistics.stdev(dm)/statistics.mean(dm),'rss_cv_pct':100*statistics.stdev(rm)/statistics.mean(rm)}
          rows={v:agg(v) for v in variants}; b=rows['baseline']
          def score(r):
              pt=64*1000/r['prefill_ms']; dt=16*1000/r['decode_ms']; return 2/(1/pt+1/dt)
          bs=score(b); bdt=16*1000/b['decode_ms']; passing=[]
          for v,r in rows.items():
              r['prefill_tps']=64*1000/r['prefill_ms']; r['decode_tps']=16*1000/r['decode_ms']; r['score']=score(r); r['speed_gain_pct']=(r['score']/bs-1)*100; r['rss_delta_pct']=(r['rss_kib']/b['rss_kib']-1)*100; r['decode_delta_pct']=(r['decode_tps']/bdt-1)*100
              r['pass']=v!='baseline' and r['speed_gain_pct']>=float(os.environ['MIN_SPEED_GAIN_PCT']) and r['rss_delta_pct']<=float(os.environ['MAX_RSS_INCREASE_PCT']) and r['prefill_cv_pct']<=float(os.environ['MAX_CV_PCT']) and r['decode_cv_pct']<=float(os.environ['MAX_CV_PCT']) and r['decode_delta_pct']>=-float(os.environ['MAX_DECODE_REGRESSION_PCT'])
              if r['pass']: passing.append((r['score'],v))
          winner=max(passing)[1] if passing else None; ranked=sorted(variants,key=lambda v:rows[v]['score'],reverse=True)
          result={'source_commit':os.environ.get('GITHUB_SHA'),'model_sha256':os.environ['MODEL_SHA256'],'winner':winner,'variant_count':20,'rows':rows}
          (root/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
          lines=['# Q4 2D scheduler screen','', 'Exact TinyStories 15M Q4_0; 20 two-dimensional row x batch-group schedules plus baseline; 3 randomized reps each; production source restored.','', '| Rank | Variant | Prefill tok/s | Decode tok/s | Gain | RSS delta | Prefill CV | Decode CV | Pass |','|---:|---|---:|---:|---:|---:|---:|---:|:---:|']
          for rank,v in enumerate(ranked,1):
              r=rows[v]; lines.append(f"| {rank} | {v} | {r['prefill_tps']:.2f} | {r['decode_tps']:.2f} | {r['speed_gain_pct']:.2f}% | {r['rss_delta_pct']:.2f}% | {r['prefill_cv_pct']:.2f}% | {r['decode_cv_pct']:.2f}% | {'YES' if r['pass'] else 'no'} |")
          lines+=['',f'Winner: **{winner or "none"}**.','Gate: >=8% combined gain, <=2% RSS increase, <=5% timing CV, <=2% decode regression.']
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n'); print((root/'SUMMARY.md').read_text())
          PY

      - name: Verify production source unchanged
        run: git diff --exit-code -- src include benchmarks tests CMakeLists.txt

      - name: Publish compact evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/q4-2d-scheduler-screen/SUMMARY.md results/q4-2d-scheduler-screen/summary.json
          git commit -m 'Publish Q4 2D scheduler screen evidence'
          git pull --rebase origin main
          git push
