name: Real Model A/B

# This workflow is intentionally push-triggered so changes to the runtime or
# benchmark harness continuously re-validate the trained-model comparison.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-model-ab.yml'
      - 'src/**'
      - 'include/**'
      - 'benchmarks/**'
      - 'tests/**'
      - 'scripts/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  stories15m-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MODEL: stories15M-q4_0.gguf
      MODEL_URL: https://huggingface.co/ggml-org/models-moved/resolve/main/tinyllamas/stories15M-q4_0.gguf?download=true
      MODEL_SHA256: 66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
      THREADS: 4
      REPS: 5
      PROMPT: 64
      GEN: 64
      CTX: 128
      BATCH: 32
      KV: f16
      OUT: v072_stories15m_ab

    steps:
      - name: Checkout MemVanta
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl git time

      - name: Build MemVanta
        run: |
          cmake -S . -B build-v072 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-v072 -j "$(nproc)"

      - name: Run MemVanta tests
        run: ctest --test-dir build-v072 --output-on-failure

      - name: Download trained TinyStories 15M Q4_0 GGUF
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$MODEL_URL" -o "$MODEL"
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -
          stat -c 'model_bytes=%s' "$MODEL"

      - name: Build current llama.cpp CPU tools
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --target llama-bench llama-cli -j "$(nproc)"

      - name: Run same-model MemVanta vs llama.cpp benchmark
        env:
          LLAMA_BIN: ./llama.cpp/build/bin
        run: bash scripts/run_stories15m_ab.sh "$MODEL"

      - name: Show summary
        if: always()
        run: |
          if [ -f "$OUT/SUMMARY.md" ]; then cat "$OUT/SUMMARY.md"; fi
          if [ -f "$OUT/summary.json" ]; then cat "$OUT/summary.json"; fi

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memvanta-stories15m-real-model-ab
          path: |
            v072_stories15m_ab/**
          if-no-files-found: warn
          retention-days: 30
