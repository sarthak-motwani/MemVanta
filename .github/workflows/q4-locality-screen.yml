name: Q4 Locality Kernel Screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q4-locality-screen.yml'

permissions:
  contents: read

env:
  MODEL: stories15M-q4_0.gguf
  MODEL_URL: https://huggingface.co/ggml-org/models-moved/resolve/main/tinyllamas/stories15M-q4_0.gguf?download=true
  MODEL_SHA256: 66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
  THREADS: 4
  CTX: 128
  PROMPT: 64
  GEN: 16
  BATCH: 32
  REPS: 5
  MAX_RSS_INCREASE_PCT: 2
  MIN_SPEED_GAIN_PCT: 5

jobs:
  q4-locality-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl time

      - name: Download exact trained model
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$MODEL_URL" -o "$MODEL"
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -

      - name: Build baseline and locality variants
        run: |
          set -euo pipefail
          cp src/gguf_kernels.cpp /tmp/gguf_kernels.baseline.cpp
          build_variant() {
            name="$1"; dist="$2"
            cp /tmp/gguf_kernels.baseline.cpp src/gguf_kernels.cpp
            if [ "$dist" != "0" ]; then
              python3 - "$dist" <<'PY'
          import pathlib, sys
          p=pathlib.Path('src/gguf_kernels.cpp')
          s=p.read_text()
          d=int(sys.argv[1])
          needle='for(std::size_t bi=0;bi<nb;++bi){const float d=fp16_to_fp32(w[bi].d);const __m128i packed=_mm_loadu_si128(reinterpret_cast<const __m128i*>(w[bi].qs));'
          repl=f'for(std::size_t bi=0;bi<nb;++bi){{if(bi+{d}<nb)__builtin_prefetch(w+(bi+{d}),0,1);const float d=fp16_to_fp32(w[bi].d);const __m128i packed=_mm_loadu_si128(reinterpret_cast<const __m128i*>(w[bi].qs));'
          if needle not in s:
              raise SystemExit('Q4 batch4 loop pattern not found')
          p.write_text(s.replace(needle,repl,1))
          PY
            fi
            cmake -S . -B "build-$name" -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-$name" --target memvanta_profile memvanta_tests memvanta_tokenizer_tests -j "$(nproc)"
            ctest --test-dir "build-$name" --output-on-failure
          }
          build_variant baseline 0
          build_variant pf1 1
          build_variant pf2 2
          build_variant pf4 4
          build_variant pf8 8
          cp /tmp/gguf_kernels.baseline.cpp src/gguf_kernels.cpp
          git diff --exit-code -- src/gguf_kernels.cpp

      - name: Run repeated RSS-gated screen
        run: |
          set -euo pipefail
          mkdir -p results/q4-locality-screen/raw
          python3 - <<'PY'
          import json, os, pathlib, random, re, statistics, subprocess
          root=pathlib.Path('results/q4-locality-screen'); raw=root/'raw'
          reps=int(os.environ['REPS']); model=os.environ['MODEL']
          variants=['baseline','pf1','pf2','pf4','pf8']
          order=variants*reps
          random.Random(20260822).shuffle(order)
          data={v:[] for v in variants}
          metric_re=re.compile(r'\b(prefill_ms|decode_total_ms)=([0-9.]+)')
          rss_re=re.compile(r'Maximum resident set size \(kbytes\):\s*(\d+)')
          for idx,v in enumerate(order,1):
              out=raw/f'{idx:02d}-{v}.txt'; tm=raw/f'{idx:02d}-{v}.time.txt'
              env=os.environ.copy(); env.update({'OMP_NUM_THREADS':'4','OMP_DYNAMIC':'FALSE','OMP_PROC_BIND':'close','OMP_PLACES':'cores','MALLOC_ARENA_MAX':'2'})
              cmd=['/usr/bin/time','-v',f'./build-{v}/memvanta_profile','--model',model,'--threads','4','--ctx','128','--prompt','64','--gen','16','--batch','32','--csv',str(raw/f'{idx:02d}-{v}.csv')]
              p=subprocess.run(cmd,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=180)
              out.write_text(p.stdout); tm.write_text(p.stderr)
              if p.returncode: raise SystemExit(f'{v} failed rc={p.returncode}')
              m=dict((k,float(x)) for k,x in metric_re.findall(p.stdout)); r=rss_re.search(p.stderr)
              if 'prefill_ms' not in m or 'decode_total_ms' not in m or not r: raise SystemExit(f'missing metrics for {v}')
              data[v].append((m['prefill_ms'],m['decode_total_ms'],float(r.group(1))))
          def agg(v):
              xs=data[v]
              pm=[x[0] for x in xs]; dm=[x[1] for x in xs]; rm=[x[2] for x in xs]
              return {'prefill_ms':statistics.mean(pm),'decode_ms':statistics.mean(dm),'rss_kib':statistics.mean(rm),
                      'prefill_cv_pct':100*statistics.stdev(pm)/statistics.mean(pm),'decode_cv_pct':100*statistics.stdev(dm)/statistics.mean(dm),'rss_cv_pct':100*statistics.stdev(rm)/statistics.mean(rm)}
          rows={v:agg(v) for v in variants}; b=rows['baseline']
          def score(r):
              pt=64*1000/r['prefill_ms']; dt=16*1000/r['decode_ms']; return 2/(1/pt+1/dt)
          bs=score(b)
          passing=[]
          for v,r in rows.items():
              r['prefill_tps']=64*1000/r['prefill_ms']; r['decode_tps']=16*1000/r['decode_ms']; r['score']=score(r)
              r['speed_gain_pct']=(r['score']/bs-1)*100
              r['rss_delta_pct']=(r['rss_kib']/b['rss_kib']-1)*100
              r['pass']=v!='baseline' and r['speed_gain_pct']>=float(os.environ['MIN_SPEED_GAIN_PCT']) and r['rss_delta_pct']<=float(os.environ['MAX_RSS_INCREASE_PCT']) and r['prefill_cv_pct']<=5 and r['decode_cv_pct']<=5
              if r['pass']: passing.append((r['score'],v))
          winner=max(passing)[1] if passing else None
          result={'source_commit':os.environ.get('GITHUB_SHA'),'model_sha256':os.environ['MODEL_SHA256'],'winner':winner,'rows':rows}
          (root/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
          lines=['# Q4 locality kernel screen','',f'Production source unchanged. Exact TinyStories Q4_0; {reps} reps/variant.','',
                 '| Variant | Prefill tok/s | Decode tok/s | Peak RSS MiB | Combined speed gain | RSS delta | Pass |','|---|---:|---:|---:|---:|---:|:---:|']
          for v in variants:
              r=rows[v]; lines.append(f"| {v} | {r['prefill_tps']:.2f} | {r['decode_tps']:.2f} | {r['rss_kib']/1024:.2f} | {r['speed_gain_pct']:.2f}% | {r['rss_delta_pct']:.2f}% | {'YES' if r['pass'] else 'no'} |")
          lines += ['',f'Winner: **{winner or "none"}**.', 'Promotion requires >=5% combined speed gain, <=2% RSS increase, and <=5% timing CV.']
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n'); print((root/'SUMMARY.md').read_text())
          PY

      - name: Verify production source unchanged
        run: git diff --exit-code -- src include benchmarks tests CMakeLists.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memvanta-q4-locality-screen
          path: results/q4-locality-screen/**
          if-no-files-found: error
          retention-days: 30
